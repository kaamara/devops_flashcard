services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: flashcard_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d flashcard_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - db_data:/var/lib/postgresql/data
  app:
    depends_on:
      db:
        condition: service_healthy
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://user:${POSTGRES_PASSWORD}@db:5432/flashcard_db
    ports:
      - "8000:8000"
volumes:
  db_data: