name: CI

on:
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v7
        - name: Set up Python
          uses: actions/setup-python@v7
          with:
            python-version: '3.13'
        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            pip install -r requirements-dev.txt
        - name: Run Lint
          run: |
            ruff check .
            ruff format --check .
        - name: Run pytest
          run: pytest

