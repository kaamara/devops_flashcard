name: CI

on:
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v7
        - name: Set up Python
          uses: actions/setup-python@v7
          with:
            python-version: '3.13'
        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            pip install -r requirements-dev.txt
        - name: Run Lint
          run: |
            ruff check .
            ruff format --check .
        - name: Run pytest
          run: pytest
  docker:
    needs: tests
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v7
        - name: Build Docker image
          run: docker build -t devops_flashcard:latest .
        - name: Run Trivy vulnerability scanner
          uses: aquasecurity/trivy-action@v0.36.0
          with:
            image-ref: 'devops_flashcard:latest'
            format: 'table'
            exit-code: '1'
            severity: 'CRITICAL,HIGH'
            ignore-unfixed: true